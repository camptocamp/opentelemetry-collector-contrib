logsmatch/default:
logsmatch/custom_regexp:
  match:
    regexp: "(?P<log_level>.+): .*"
logsmatch/custom_attribute:
  match:
    attribute: "message"
logsmatch/custom_metric_name:
  metric:
    name: "custom_logs_match"
logsmatch/custom_metric_description:
  metric:
    description: "Custom description"
logsmatch/do_not_keep_timestamp:
  metric:
    keep_timestamp: false
logsmatch/custom_all:
  match:
    regexp: "(?P<log_level>.+): .*"
    attribute: "message"
  metric:
    name: "custom_logs_match"
    description: "Custom description"
